<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ZeroTerm terminal scroll regression</title>
    <link rel="stylesheet" href="../frontend/assets/xterm.min.css" />
    <link rel="stylesheet" href="../frontend/styles.css" />
    <style>
      html, body { margin: 0; background: #08111f; color: #dbeafe; font: 14px sans-serif; }
      .pane-body { width: 900px; height: 420px; }
      #terminal { width: 900px; height: 420px; }
      #result { white-space: pre-wrap; padding: 12px; }
    </style>
  </head>
  <body>
    <div class="pane-body"><div id="terminal"></div></div>
    <pre id="result">running</pre>
    <script src="../frontend/assets/xterm.min.js"></script>
    <script>
      const nextFrame = () => new Promise((resolve) => requestAnimationFrame(resolve));
      const write = (term, data) => new Promise((resolve) => term.write(data, resolve));
      const inspectCustomScrollbar = () => {
        const terminalRect = document.getElementById("terminal").getBoundingClientRect();
        const verticalScrollbar = document.querySelector(".xterm-scrollable-element > .scrollbar.vertical");
        const verticalSlider = verticalScrollbar?.querySelector(".slider");
        const scrollbarRect = verticalScrollbar?.getBoundingClientRect();
        const scrollbarStyle = verticalScrollbar ? getComputedStyle(verticalScrollbar) : null;
        const sliderStyle = verticalSlider ? getComputedStyle(verticalSlider) : null;
        return {
          width: scrollbarRect?.width ?? null,
          contained: Boolean(scrollbarRect
            && scrollbarRect.left >= terminalRect.left
            && scrollbarRect.right <= terminalRect.right + 0.5),
          track: scrollbarStyle?.backgroundColor ?? null,
          thumb: sliderStyle?.backgroundColor ?? null,
          thumbRadius: sliderStyle?.borderRadius ?? null,
        };
      };

      window.testPromise = (async () => {
        const term = new Terminal({
          cols: 100,
          rows: 24,
          scrollback: 2000,
          scrollOnUserInput: true,
        });
        term.open(document.getElementById("terminal"));
        const initialScrollbar = inspectCustomScrollbar();
        document.body.dataset.scrollbarStyle = initialScrollbar.width === 8
          && initialScrollbar.contained
          && initialScrollbar.thumb !== "rgba(0, 0, 0, 0)"
          && initialScrollbar.thumbRadius === "999px"
          && !document.querySelector(".xterm-decoration-overview-ruler")
          ? "passed"
          : "failed";

        await write(term, Array.from(
          { length: 500 },
          (_, i) => `normal-buffer-${String(i).padStart(4, "0")}\r\n`,
        ).join(""));
        term.scrollToBottom();

        const cycles = [];
        for (let cycle = 0; cycle < 12; cycle += 1) {
          await write(term, "\x1b[?1049h");
          await write(term, Array.from(
            { length: 40 },
            (_, line) => `alternate-${cycle}-${line}\r\n`,
          ).join(""));
          term.scrollLines(-18);
          term.scrollLines(9);
          term.scrollLines(-6);
          await write(term, "\x1b[?1049l");
          await nextFrame();
          await nextFrame();

          const buffer = term.buffer.active;
          const viewport = document.querySelector(".xterm-viewport");
          const bufferAtBottom = buffer.viewportY === buffer.baseY;
          const domDistanceFromBottom = viewport
            ? Math.abs(viewport.scrollHeight - viewport.clientHeight - viewport.scrollTop)
            : Number.POSITIVE_INFINITY;
          cycles.push({
            cycle,
            type: buffer.type,
            baseY: buffer.baseY,
            viewportY: buffer.viewportY,
            bufferAtBottom,
            domDistanceFromBottom,
          });
        }

        const customScrollbar = inspectCustomScrollbar();

        const passed = cycles.every((entry) =>
          entry.type === "normal"
          && entry.bufferAtBottom
          && entry.domDistanceFromBottom <= 2
        )
          && customScrollbar.width === 8
          && customScrollbar.contained
          && customScrollbar.thumb !== "rgba(0, 0, 0, 0)"
          && customScrollbar.thumbRadius === "999px"
          && !document.querySelector(".xterm-decoration-overview-ruler");
        const result = { passed, customScrollbar, cycles };
        document.getElementById("result").textContent = JSON.stringify(result, null, 2);
        document.body.dataset.testStatus = passed ? "passed" : "failed";
        return result;
      })().catch((error) => {
        const result = { passed: false, error: String(error?.stack || error) };
        document.getElementById("result").textContent = JSON.stringify(result, null, 2);
        document.body.dataset.testStatus = "failed";
        return result;
      });
    </script>
  </body>
</html>
