[package]
name = "zeroterm-desktop"
version = "0.1.11"
description = "ZeroTerm desktop app"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "zeroterm_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
zeroterm-ssh   = { path = "../../core/crates/zeroterm-ssh" }
zeroterm-vault = { path = "../../core/crates/zeroterm-vault" }
zeroterm-app   = { path = "../../core/crates/zeroterm-app", features = ["webdav-backend", "s3-backend"] }
zeroterm-sync  = { path = "../../core/crates/zeroterm-sync", features = ["webdav-backend", "s3-backend"] }

tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
dirs = "5"
futures-util = "0.3"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4"] }
portable-pty = "0.8"
chacha20poly1305 = { version = "0.10", features = ["std"] }
base64 = "0.22"
sha2 = "0.10"
fontdb = "0.16"
encoding_rs = "0.8"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
