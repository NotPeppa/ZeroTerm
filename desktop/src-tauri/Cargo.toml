[package]
name = "zeroterm-desktop"
version = "0.0.1"
description = "ZeroTerm desktop app"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "zeroterm_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
zeroterm-ssh   = { path = "../../core/crates/zeroterm-ssh" }
zeroterm-vault = { path = "../../core/crates/zeroterm-vault" }
zeroterm-app   = { path = "../../core/crates/zeroterm-app" }

tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
