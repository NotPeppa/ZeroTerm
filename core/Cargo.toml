[workspace]
resolver = "2"
members = [
    "crates/zeroterm-ssh",
    "crates/zeroterm-cli",
    "crates/zeroterm-store",
    "crates/zeroterm-crypto",
    "crates/zeroterm-vault",
    "crates/zeroterm-app",
    "crates/zeroterm-ffi",
    "crates/zeroterm-sync",
    "crates/zeroterm-term",
]
exclude = ["vendor/russh"]

[workspace.package]
version = "0.1.11"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NotPeppa/ZeroTerm"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# SSH
# russh 0.62.x fixes the allocation advisories affecting <= 0.60.2 as well
# as CVE-2025-54804 (CHANNEL_WINDOW_ADJUST overflow, DEP-1).
# The Handler impl uses native `async fn`, so no
# async-trait feature is needed. russh-keys was merged into `russh::keys`
# in this line, so the separate crate is gone.
russh = "0.62"
russh-sftp = "2.3"

# Errors
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Filesystem helpers
dirs = "5"

# CLI deps
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
rpassword = "7"
dialoguer = { version = "0.11", default-features = false }
futures = "0.3"
async-trait = "0.1"

# Storage (vault / future sync)
rusqlite = { version = "0.31", features = ["bundled"] }

# Crypto
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
hex = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# OS keychain integration
keyring = "2"

# IDs
uuid = { version = "1.10", features = ["v7"] }

# FFI
uniffi = { version = "0.28", features = ["cli", "tokio"] }

# Terminal emulator (Apache-2.0) — pin like russh
# Vendored 0.24.2: tty/event_loop disabled on Android (openpty NDK break).
alacritty_terminal = { path = "vendor/alacritty_terminal", default-features = false }

# Dev
tempfile = "3"

[patch.crates-io]
# Fixed 0.62.4 with a narrow client-side extension that preserves an
# OpenSSH host certificate through KEX and exposes it to Handler. Upstream
# currently parses every K_S blob as a plain PublicKey, which makes
# @cert-authority verification impossible at the application boundary.
russh = { path = "vendor/russh" }
