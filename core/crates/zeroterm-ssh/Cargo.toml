[package]
name = "zeroterm-ssh"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SSH protocol layer of ZeroTerm — wraps russh with a stable async API"

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
russh = { workspace = true }
russh-sftp = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
dirs = { workspace = true }
base64 = { workspace = true }
zeroize = { workspace = true }
url = "2"
rand_ssh = { package = "rand", version = "0.10" }
# known_hosts hashed-hostname matching (|1|salt|hash|, HMAC-SHA1).
# Both are already in the tree transitively via russh.
hmac = "0.12"
sha1 = "0.10"
