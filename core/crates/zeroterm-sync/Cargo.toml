[package]
name = "zeroterm-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Old single-blob WebDAV / S3 / filesystem backends. RFC-002 deprecated
# them; the code lives on under `src/legacy.rs` until M7/M8 port the
# new repo-layout SyncAdapter trait to those backends.
legacy-backends = [
    "dep:reqwest",
    "dep:quick-xml",
    "dep:aws-config",
    "dep:aws-sdk-s3",
    "dep:aws-credential-types",
]
# Repo-layout WebDAV adapter (M7). Pulls reqwest + quick-xml; opt-in
# because not every consumer (e.g. the CLI / mobile FFI) needs it.
webdav-backend = ["dep:reqwest", "dep:quick-xml"]
# Repo-layout S3 adapter (M8). Pulls the aws-sdk-s3 stack; opt-in
# because it adds ~30 s to clean builds and ~6 MB to release binaries.
s3-backend = ["dep:aws-config", "dep:aws-sdk-s3", "dep:aws-credential-types"]

[dependencies]
zeroterm-crypto = { path = "../zeroterm-crypto" }
zeroterm-ssh = { path = "../zeroterm-ssh" }

async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
zeroize.workspace = true
base64.workspace = true
# Legacy-only deps; only pulled in when `legacy-backends` is enabled.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
quick-xml = { version = "0.38", optional = true }
aws-config = { version = "1", optional = true }
aws-sdk-s3 = { version = "1", optional = true }
aws-credential-types = { version = "1", optional = true }

[dev-dependencies]
tempfile.workspace = true
