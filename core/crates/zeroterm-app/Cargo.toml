[package]
name = "zeroterm-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Orchestration layer: vault-aware host management on top of zeroterm-ssh + zeroterm-vault"

[features]
default = []
# Forward to zeroterm-sync's webdav-backend feature so callers can
# opt into the WebDAV sync adapter from the top-level crate.
webdav-backend = ["zeroterm-sync/webdav-backend"]
# Forward to zeroterm-sync's s3-backend feature.
s3-backend = ["zeroterm-sync/s3-backend"]

[dependencies]
zeroterm-ssh = { path = "../zeroterm-ssh" }
zeroterm-vault = { path = "../zeroterm-vault" }
zeroterm-sync = { path = "../zeroterm-sync" }

serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
keyring = { workspace = true }
tokio = { workspace = true }
zeroize = { workspace = true }

thiserror = { workspace = true }
tracing = { workspace = true }

# Warpgate target directory (warpgate.rs). Same versions the FFI/desktop
# crates already resolve; rustls is direct only for the pinned-cert verifier.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
# Local TLS server for the Warpgate certificate-pinning test.
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tempfile = { workspace = true }
anyhow = { workspace = true }
