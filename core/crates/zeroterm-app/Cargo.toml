[package]
name = "zeroterm-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Orchestration layer: vault-aware host management on top of zeroterm-ssh + zeroterm-vault"

[features]
default = []
# Forward to zeroterm-sync's webdav-backend feature so callers can
# opt into the WebDAV sync adapter from the top-level crate.
webdav-backend = ["zeroterm-sync/webdav-backend"]
# Forward to zeroterm-sync's s3-backend feature.
s3-backend = ["zeroterm-sync/s3-backend"]

[dependencies]
zeroterm-ssh = { path = "../zeroterm-ssh" }
zeroterm-vault = { path = "../zeroterm-vault" }
zeroterm-sync = { path = "../zeroterm-sync" }

serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
keyring = { workspace = true }
tokio = { workspace = true }
zeroize = { workspace = true }

thiserror = { workspace = true }
tracing = { workspace = true }

reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
rcgen = "0.13"
tokio-rustls = "0.26"
tempfile = { workspace = true }
anyhow = { workspace = true }
